- name: Setup Node.js
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 加上這一段：先安裝套件
      - name: Install dependencies
        run: npm install axios cheerio

      # 再執行程式
      - name: Run update script
        run: node update.js
