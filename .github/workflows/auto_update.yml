name: 自動更新 7788.js

on:
  schedule:
    # 台灣時間 21:00 執行抓順球 (UTC 13:00)
    - cron: '0 13 * * 1-6'
    # 台灣時間 23:00 執行抓落球覆蓋 (UTC 15:00)
    - cron: '0 15 * * 1-6'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 判斷執行時間並自動更新
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq "13" ]; then
            echo "--- 台灣時間 21:00：執行抓取順球 ---"
            node update.js shun
          else
            echo "--- 台灣時間 23:00：執行抓取落球 ---"
            node update.js luo
          fi

      - name: 自動提交並推送變更至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 7788.js
          git commit -m "Auto-update 7788.js via GitHub Actions" || exit 0
          git push
