name: Auto Update 7788.js

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週六
    # 20:45 -> UTC 12:45
    - cron: '45 12 * * 1-6'
    # 21:00 -> UTC 13:00
    - cron: '0 13 * * 1-6'
    # 21:30 -> UTC 13:30
    - cron: '30 15 * * 1-6'
  
  workflow_dispatch:

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. 執行 7788.js 更新腳本
        run: node update.js

      - name: 4. 自動提交並推送到 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 7788.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 7788.js drop data [skip ci]" && git push)
