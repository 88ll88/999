name: Auto Update 7788.js

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週六 
    # 20:40 對應 UTC 12:40
    - cron: '40 12 * * 1-6'
    # 21:00 對應 UTC 13:00
    - cron: '0 13 * * 1-6'
  
  # 允許您在 GitHub 網頁上手動點擊按鈕立即執行
  workflow_dispatch:

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    
    # 賦予 Git 寫入權限，才能自動 push 檔案
    permissions:
      contents: write

    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. 執行 7788.js 更新腳本
        run: node update.js

      - name: 4. 自動提交並推送到 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 7788.js
          
          # 檢查是否有變更，有變更才 commit & push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 7788.js data [skip ci]" && git push)
