name: auto_update.yml

on:
  schedule:
    # 順球時段
    - cron: '40 12 * * 1-6' # 台灣時間 20:40
    - cron: '50 12 * * 1-6' # 台灣時間 20:50
    # 落球時段
    - cron: '00 13 * * 1-6'  # 台灣時間 21:00
    - cron: '30 13 * * 1-6' # 台灣時間 21:30
    - cron: '00 18 * * 1-6'  # 18:00 UTC = 台灣時間隔天凌晨 02:00
    - cron: '20 18 * * 1-6'  # 18:00 UTC = 台灣時間隔天凌晨 02:20
    - cron: '40 18 * * 1-6'  # 18:00 UTC = 台灣時間隔天凌晨 02:40
    - cron: '00 19 * * 1-6'  # 18:00 UTC = 台灣時間隔天凌晨 03:00
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update.js

      - name: Commit and push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add 7788.js
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update 7788.js via GitHub Actions" && git push)
