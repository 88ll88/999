name: 自動更新 7788 今彩539 獎號

on:
  schedule:
    # 台北時間 20:40, 20:50 (順球時段) -> 轉為 UTC 是 12:40, 12:50
    - cron: '40 12 * * 1-6'
    - cron: '50 12 * * 1-6'
    
    # 台北時間 21:00, 21:30, 22:00 (落球時段) -> 轉為 UTC 是 13:00, 13:30, 14:00
    - cron: '00 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '00 14 * * 1-6'
    
  workflow_dispatch: # 允許手動點擊執行

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: 檢查出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 執行更新腳本
      run: |
        # 殺手鐧：不管 update.js 裡寫什麼，強制把裡面的舊網址和可能造成 Invalid URL 的程式碼直接替换掉！
        sed -i 's|://taiwanlottery.com|://taiwanlottery.com|g' update.js
        sed -i 's|https://taiwanlottery.com|https://://taiwanlottery.com|g' update.js
        
        node update.js || exit 0

    - name: 檢查檔案是否有變動並提交回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 7788.js
        
        if ! git diff --cached --quiet; then
          git commit -m "🤖 自動更新獎號 [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push
        else
          echo "7788.js 沒有任何變動，跳過 Commit。"
        fi
