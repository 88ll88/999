name: 自動更新 7788 今彩539 獎號

on:
  schedule:
    # 每天晚上 20:45 至 23:45，每 15 分鐘自動執行一次，抓取最新開獎
    - cron: '45 12 * * 1-6'
    - cron: '00 13 * * 1-6'
    - cron: '15 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '45 13 * * 1-6'
    - cron: '00 14 * * 1-6'
    - cron: '30 14 * * 1-6'
    
  workflow_dispatch: # 允許平板手動點擊執行測試

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢查出專案程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. 建立並執行網頁文字精準查找腳本
      run: |
        rm -f update.js
        rm -f update_pure.js

        cat << 'EOF' > update.js
        const https = require('https');
        const fs = require('fs');
        const path = require('path');

        const NFD_URL = 'https://nfd.com.tw';
        const FILE_PATH = path.join(__dirname, '7788.js');

        function getTaipeiTodayStr() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const tzNow = new Date(utc + (3600000 * 8));
            return `${tzNow.getFullYear()}-${String(tzNow.getMonth() + 1).padStart(2, '0')}-${String(tzNow.getDate()).padStart(2, '0')}`;
        }

        function fetchNFDHtml() {
            return new Promise((resolve, reject) => {
                const req = https.get(new URL(NFD_URL), {
                    headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' },
                    timeout: 15000
                }, (res) => {
                    let chunks = [];
                    res.on('data', (chunk) => { chunks.push(chunk); });
                    res.on('end', () => {
                        const buffer = Buffer.concat(chunks);
                        // 樂透研究院是舊型網頁，直接轉成 ascii/binary 排除中文字干擾，純抓數字與斜線
                        resolve(buffer.toString('binary'));
                    });
                });
                req.on('error', reject);
                req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
            });
        }

        async function main() {
            try {
                const todayStr = getTaipeiTodayStr();
                console.log(`【系統啟動】今天的台北日期為: ${todayStr}`);

                if (!fs.existsSync(FILE_PATH)) {
                    console.error('找不到 7788.js 檔案！');
                    process.exit(0);
                }
                let fileContent = fs.readFileSync(FILE_PATH, 'utf-8');

                const firstLineRegex = /\['(\d{4}-\d{2}-\d{2})'/;
                const match = fileContent.match(firstLineRegex);
                if (!match) {
                    console.error('無法解析 7788.js 的首列日期');
                    process.exit(0);
                }
                const lastUpdatedDate = match[1];
                console.log(`7788.js 檔案內最新的一列日期為: ${lastUpdatedDate}`);

                if (lastUpdatedDate >= todayStr) {
                    console.log('🎉 檔案資料已是最新，沒有任何未更新的期數。');
                    process.exit(0);
                }

                console.log(`偵測到未更新！開始下載樂透研究院全頁原始碼...`);
                const html = await fetchNFDHtml();

                // 移除網頁中所有干擾的空格、換行、逗號、HTML標籤，全部壓平成純文字
                const cleanText = html.replace(/<[^>]*>/g, '').replace(/[\s,]+/g, '');

                // NFD 網頁特徵：西元日期通常會寫成像 2026/10/29 或 2026-10-29
                // 我們用靈活的正則表達式，自動比對「年/月/日」或「月/日」後面的 5 組雙位數
                const recordRegex = /(\d{4})[\/\.-](\d{1,2})[\/\.-](\d{1,2})([0-3]\d)([0-3]\d)([0-3]\d)([0-3]\d)([0-3]\d)/g;
                
                let foundRows = [];
                let regexMatch;

                while ((regexMatch = recordRegex.exec(cleanText)) !== null) {
                    const formattedDate = `${regexMatch[1]}-${regexMatch[2].padStart(2, '0')}-${regexMatch[3].padStart(2, '0')}`;
                    
                    if (formattedDate > lastUpdatedDate && formattedDate <= todayStr) {
                        const nums = [regexMatch[4], regexMatch[5], regexMatch[6], regexMatch[7], regexMatch[8]];
                        foundRows.push({ date: formattedDate, numbers: nums });
                    }
                }

                if (foundRows.length === 0) {
                    console.log('⚠️ 暴力解析依舊未抓到對應日期的連續數字，可能網頁格式有變，先跳過。');
                    process.exit(0);
                }

                foundRows.sort((a, b) => a.date.localeCompare(b.date));

                let insertText = '';
                foundRows.forEach(row => {
                    insertText += `['${row.date}',['${row.numbers.join("','")}']],\n`;
                    console.log(`成功解析到未更新期數: ${row.date} -> ${row.numbers.join(',')}`);
                });

                if (insertText) {
                    fileContent = fileContent.replace('var 7788 = [\n', `var 7788 = [\n${insertText}`);
                    fs.writeFileSync(FILE_PATH, fileContent, 'utf-8');
                    console.log('✅ 未更新的缺失期數已全部補齊，成功寫入 7788.js！');
                }

                process.exit(0);
            } catch (err) {
                console.error('執行過程中發生嚴重錯誤:', err.message);
                process.exit(0);
            }
        }
        main();
        EOF
        
        node update.js

    - name: 4. 檢查檔案變動並自動提交
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 7788.js
        
        if ! git diff --cached --quiet; then
          git commit -m "🤖 自動補登樂透研究院最新獎號 [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push
        else
          echo "7788.js 資料無變動，安全跳過 Commit。"
        fi
