name: 自動更新 7788 今彩539 獎號

on:
  schedule:
    # 每天晚上 20:45 至 23:45，每 15 分鐘自動執行一次
    - cron: '45 12 * * 1-6'
    - cron: '00 13 * * 1-6'
    - cron: '15 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '45 13 * * 1-6'
    - cron: '00 14 * * 1-6'
    - cron: '30 14 * * 1-6'
    
  workflow_dispatch: # 允許平板手動點擊執行測試

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢查出專案程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. 建立並執行網頁原始碼精準解析腳本
      run: |
        rm -f update.js
        rm -f update_pure.js

        cat << 'EOF' > update.js
        const https = require('https');
        const fs = require('fs');
        const path = require('path');

        const NFD_URL = 'https://nfd.com.tw';
        const FILE_PATH = path.join(__dirname, '7788.js');

        function getTaipeiTodayStr() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const tzNow = new Date(utc + (3600000 * 8));
            return `${tzNow.getFullYear()}-${String(tzNow.getMonth() + 1).padStart(2, '0')}-${String(tzNow.getDate()).padStart(2, '0')}`;
        }

        function fetchNFDHtml() {
            return new Promise((resolve, reject) => {
                const req = https.get(new URL(NFD_URL), {
                    headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' },
                    timeout: 15000
                }, (res) => {
                    let chunks = [];
                    res.on('data', (chunk) => { chunks.push(chunk); });
                    res.on('end', () => {
                        const buffer = Buffer.concat(chunks);
                        resolve(buffer.toString('utf-8'));
                    });
                });
                req.on('error', reject);
                req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
            });
        }

        async function main() {
            try {
                const todayStr = getTaipeiTodayStr();
                console.log(`【系統啟動】今天的台北日期為: ${todayStr}`);

                if (!fs.existsSync(FILE_PATH)) {
                    console.error('找不到 7788.js 檔案！');
                    process.exit(0);
                }
                let fileContent = fs.readFileSync(FILE_PATH, 'utf-8');

                const firstLineRegex = /\['(\d{4}-\d{2}-\d{2})'/;
                const match = fileContent.match(firstLineRegex);
                if (!match) {
                    console.error('無法解析 7788.js 的首列日期');
                    process.exit(0);
                }
                const lastUpdatedDate = match;
                console.log(`7788.js 檔案內最新的一列日期為: ${lastUpdatedDate}`);

                if (lastUpdatedDate >= todayStr) {
                    console.log('🎉 檔案資料已是最新，沒有任何未更新的期數。');
                    process.exit(0);
                }

                console.log(`偵測到未更新！開始精準抓取網頁表格特徵...`);
                const html = await fetchNFDHtml();

                // 根據您提供的 HTML 結構，設計完美的正則表達式
                // 1. 抓取日期：color="#000080">YYYY-MM-DD
                // 2. 抓取順球(紅色字體)：color="#FF0000">XX&nbsp;XX&nbsp;XX&nbsp;XX&nbsp;XX
                const rowRegex = /color="#000080">(\d{4}-\d{2}-\d{2})[\s\S]*?color="#FF0000">(\d{2})&nbsp;(\d{2})&nbsp;(\d{2})&nbsp;(\d{2})&nbsp;(\d{2})/g;
                
                let foundRows = [];
                let regexMatch;

                while ((regexMatch = rowRegex.exec(html)) !== null) {
                    const formattedDate = regexMatch;
                    
                    // 只要網頁日期大於檔案日期，且不大於今天，通通抓下來
                    if (formattedDate > lastUpdatedDate && formattedDate <= todayStr) {
                        const nums = [regexMatch, regexMatch, regexMatch, regexMatch, regexMatch];
                        foundRows.push({ date: formattedDate, numbers: nums });
                    }
                }

                if (foundRows.length === 0) {
                    console.log('⚠️ 網頁原始碼中尚未搜尋到符合條件的新期別，先跳過。');
                    process.exit(0);
                }

                // 依照日期由舊到新排序
                foundRows.sort((a, b) => a.date.localeCompare(b.date));

                let insertText = '';
                foundRows.forEach(row => {
                    // 嚴格遵循格式，完全沒有空格
                    insertText += `['${row.date}',['${row.numbers.join("','")}']],\n`;
                    console.log(`精準抓取成功！準備補登: ${row.date} -> 順球: ${row.numbers.join(',')}`);
                });

                if (insertText) {
                    fileContent = fileContent.replace('var 7788 = [\n', `var 7788 = [\n${insertText}`);
                    fs.writeFileSync(FILE_PATH, fileContent, 'utf-8');
                    console.log('✅ 未更新的缺失期數已根據 NFD 表格成功全部補齊！');
                }

                process.exit(0);
            } catch (err) {
                console.error('執行過程中發生嚴重錯誤:', err.message);
                process.exit(0);
            }
        }
        main();
        EOF
        
        node update.js

    - name: 4. 檢查檔案變動並自動提交
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 7788.js
        
        if ! git diff --cached --quiet; then
          git commit -m "🤖 精準補登 NFD 最新順球獎號 [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push
        else
          echo "7788.js 資料無變動，安全跳過 Commit。"
        fi
