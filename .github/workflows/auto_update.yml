name: 自動更新 7788 今彩539 獎號

on:
  schedule:
    # 每天晚上 20:45 至 23:45，每 15 分鐘自動執行一次，抓取最新開獎
    - cron: '45 12 * * 1-6'
    - cron: '00 13 * * 1-6'
    - cron: '15 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '45 13 * * 1-6'
    - cron: '00 14 * * 1-6'
    - cron: '30 14 * * 1-6'
    
  workflow_dispatch: # 允許平板手動點擊執行測試

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢查出專案程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. 建立並執行未更新期數查找腳本
      run: |
        rm -f update.js
        rm -f update_pure.js

        cat << 'EOF' > update.js
        const https = require('https');
        const fs = require('fs');
        const path = require('path');

        const NFD_URL = 'https://nfd.com.tw';
        const FILE_PATH = path.join(__dirname, '7788.js');

        // 取得台北時間今天的標準日期 (YYYY-MM-DD)
        function getTaipeiTodayStr() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const tzNow = new Date(utc + (3600000 * 8));
            return `${tzNow.getFullYear()}-${String(tzNow.getMonth() + 1).padStart(2, '0')}-${String(tzNow.getDate()).padStart(2, '0')}`;
        }

        function fetchNFDHtml() {
            return new Promise((resolve, reject) => {
                const req = https.get(new URL(NFD_URL), {
                    headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' },
                    timeout: 15000
                }, (res) => {
                    let chunks = [];
                    res.on('data', (chunk) => { chunks.push(chunk); });
                    res.on('end', () => {
                        const buffer = Buffer.concat(chunks);
                        resolve(buffer.toString('utf-8'));
                    });
                });
                req.on('error', reject);
                req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
            });
        }

        async function main() {
            try {
                const todayStr = getTaipeiTodayStr();
                console.log(`【系統啟動】今天的台北日期為: ${todayStr}`);

                if (!fs.existsSync(FILE_PATH)) {
                    console.error('找不到 7788.js 檔案！');
                    process.exit(0);
                }
                let fileContent = fs.readFileSync(FILE_PATH, 'utf-8');

                // 精準抓取 7788.js 目前的首列日期
                const firstLineRegex = /\['(\d{4}-\d{2}-\d{2})'/;
                const match = fileContent.match(firstLineRegex);
                if (!match) {
                    console.error('無法解析 7788.js 的首列日期');
                    process.exit(0);
                }
                const lastUpdatedDate = match[1];
                console.log(`7788.js 檔案內最新的一列日期為: ${lastUpdatedDate}`);

                // 如果檔案日期已經大於或等於今天，代表完全沒有未更新的期數
                if (lastUpdatedDate >= todayStr) {
                    console.log('🎉 檔案資料已是最新，沒有未更新的期數，結束排程。');
                    process.exit(0);
                }

                console.log(`偵測到未更新！開始從樂透研究院網頁查找大於 ${lastUpdatedDate} 的獎號...`);
                const html = await fetchNFDHtml();

                // 樂透研究院今彩539歷史網頁的特徵是：日期後面會依序出現 5 個號碼
                // 我們用正則表達式把網頁裡所有的歷史紀錄一次撈出來
                const recordRegex = /(\d{4})[/\.-](\d{2})[/\.-](\d{2})[\s\\S]*?(\d{2})[\s\\S]*?(\d{2})[\s\\S]*?(\d{2})[\s\\S]*?(\d{2})[\s\\S]*?(\d{2})/g;
                let foundRows = [];
                let regexMatch;

                while ((regexMatch = recordRegex.exec(html)) !== null) {
                    const formattedDate = `${regexMatch[1]}-${regexMatch[2]}-${regexMatch[3]}`;
                    
                    // 只要網頁上的日期比我們檔案裡的日期新，且不大於今天，就是我們漏掉需要補的！
                    if (formattedDate > lastUpdatedDate && formattedDate <= todayStr) {
                        const nums = [regexMatch[4], regexMatch[5], regexMatch[6], regexMatch[7], regexMatch[8]];
                        foundRows.push({ date: formattedDate, numbers: nums });
                    }
                }

                if (foundRows.length === 0) {
                    console.log('⚠️ 樂透研究院網頁上尚未更新最新一期的文字，先跳過本次查找。');
                    process.exit(0);
                }

                // 將抓到的未更新期數，依照日期由舊到新排序，確保插入順序正確
                foundRows.sort((a, b) => a.date.localeCompare(b.date));

                let insertText = '';
                foundRows.forEach(row => {
                    // 完全遵循規格，絕對不留空格
                    insertText += `['${row.date}',['${row.numbers.join("','")}']],\n`;
                    console.log(`發現未更新期數，準備補登: ${row.date} -> ${row.numbers.join(',')}`);
                });

                if (insertText) {
                    // 把整理好的多期或單期新內容，直接塞進 var 7788 = [ 的下一行
                    fileContent = fileContent.replace('var 7788 = [\n', `var 7788 = [\n${insertText}`);
                    fs.writeFileSync(FILE_PATH, fileContent, 'utf-8');
                    console.log('✅ 缺失的期數已成功全部補齊寫入 7788.js！');
                }

                process.exit(0);
            } catch (err) {
                console.error('執行過程中發生嚴重錯誤:', err.message);
                process.exit(0);
            }
        }
        main();
        EOF
        
        node update.js

    - name: 4. 檢查檔案變動並自動提交
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 7788.js
        
        if ! git diff --cached --quiet; then
          git commit -m "🤖 自動補登缺失獎號 [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push
        else
          echo "7788.js 資料無變動，跳過 Commit。"
        fi
