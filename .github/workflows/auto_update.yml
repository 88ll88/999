name: update-data

on:
  schedule:
    # 台灣時間 20:35, 21:00, 21:30, 22:00
    - cron: '35 12 * * 1-6'
    - cron: '0 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '0 14 * * 1-6'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @octokit/rest node-fetch

      - name: Run update script
        env:
          PAT_88LL88: ${{ secrets.PAT_88LL88 }}
        run: node update.js
