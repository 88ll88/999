name: 539 Auto Update

on:
  schedule:
    # 這裡的 Cron 排程時間已轉換為台灣時間：
    # 12:40 UTC = 20:40 台灣時間
    # 13:00 UTC = 21:00 台灣時間
    # 13:30 UTC = 21:30 台灣時間
    # 14:00 UTC = 22:00 台灣時間
    - cron: '40 12 * * 1-6'
    - cron: '00 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '00 14 * * 1-6'
  workflow_dispatch: # 保留手動點擊執行按鈕

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查專案原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安裝網頁爬蟲套件
        run: npm install axios cheerio

      - name: 執行更新腳本
        run: node update.js

      - name: 將最新資料提交回 GitHub 倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 7788.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto updated 539 numbers" && git push)
