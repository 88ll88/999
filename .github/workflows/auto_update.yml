name: Auto Update 539 Data

on:
  schedule:
    # 每天 20:40, 20:50, 21:00, 21:30, 22:00 執行 (注意 GitHub Actions 時間為 UTC，需換算或調整)
    # 台灣時間 (UTC+8) 20:40 = UTC 12:40
    - cron: '40,50 12 * * 1-6'
    # 台灣時間 (UTC+8) 21:00, 21:30, 22:00 = UTC 13:00, 13:30, 14:00
    - cron: '0,30 13 * * 1-6'
    - cron: '0 14 * * 1-6'

  workflow_dispatch: # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios cheerio

      - name: Run Update Script
        run: node 999/update.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 999/7788.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update 7788.js [skip ci]" && git push)
