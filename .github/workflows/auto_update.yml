name: 自動更新 7788 今彩539 獎號

on:
  schedule:
    # 台北時間 20:40, 20:50 (順球時段) -> 轉為 UTC 是 12:40, 12:50
    - cron: '40 12 * * 1-6'
    - cron: '50 12 * * 1-6'
    
    # 台北時間 21:00, 21:30, 22:00 (落球時段) -> 轉為 UTC 是 13:00, 13:30, 14:00
    - cron: '00 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '00 14 * * 1-6'
    
  workflow_dispatch: # 允許手動點擊執行測試

jobs:
  update-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 檢查出專案程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Node.js 環境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. 建立並執行獨立更新腳本
      run: |
        rm -f update.js
        rm -f update_pure.js

        cat << 'EOF' > update.js
        const https = require('https');
        const fs = require('fs');
        const path = require('path');

        const NFD_URL = 'https://nfd.com.tw';
        const FILE_PATH = path.join(__dirname, '7788.js');

        function getTaipeiDateInfo() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const tzNow = new Date(utc + (3600000 * 8));
            
            const year = tzNow.getFullYear();
            const month = String(tzNow.getMonth() + 1).padStart(2, '0');
            const date = String(tzNow.getDate()).padStart(2, '0');
            const hours = tzNow.getHours();
            const minutes = tzNow.getMinutes();
            
            const todayStr = `${year}-${month}-${date}`;
            const dayOfWeek = tzNow.getDay();

            let targetDateStr = todayStr;
            const timeValue = hours * 100 + minutes;

            // 00:00 至 20:40 算昨天的帳
            if (timeValue < 2040) {
                const yesterday = new Date(tzNow.getTime() - 86400000);
                targetDateStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;
            }
            return { targetDateStr, timeValue, dayOfWeek };
        }

        function fetchNFDHtml() {
            return new Promise((resolve, reject) => {
                const req = https.get(new URL(NFD_URL), {
                    headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' },
                    timeout: 15000
                }, (res) => {
                    let chunks = [];
                    res.on('data', (chunk) => { chunks.push(chunk); });
                    res.on('end', () => {
                        const buffer = Buffer.concat(chunks);
                        resolve(buffer.toString('utf-8'));
                    });
                });
                req.on('error', reject);
                req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
            });
        }

        async function main() {
            try {
                const { targetDateStr, timeValue, dayOfWeek } = getTaipeiDateInfo();
                console.log(`[NFD排程啟動] 目標日期: ${targetDateStr}, 目前時間權重: ${timeValue}`);

                if (dayOfWeek === 0) {
                    console.log('週日休市，不執行更新。');
                    process.exit(0);
                }

                if (!fs.existsSync(FILE_PATH)) {
                    console.error('找不到 7788.js 檔案！');
                    process.exit(0);
                }
                let fileContent = fs.readFileSync(FILE_PATH, 'utf-8');

                const firstLineRegex = /\['(\d{4}-\d{2}-\d{2})'/;
                const match = fileContent.match(firstLineRegex);
                if (!match) {
                    console.error('無法解析 7788.js 的首列日期');
                    process.exit(0);
                }
                const lastUpdatedDate = match;
                console.log(`7788.js 最新一列日期為: ${lastUpdatedDate}`);

                const d1 = new Date(targetDateStr);
                const d2 = new Date(lastUpdatedDate);
                const diffTime = Math.abs(d1 - d2);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                // 情況一：兩期以上（含兩期）未更新 -> 抓 NFD 補登
                if (diffDays >= 2 && lastUpdatedDate < targetDateStr) {
                    console.log(`[多期未更新] 觸發 NFD 補登邏輯...`);
                    try {
                        const html = await fetchNFDHtml();
                        const cleanDate = targetDateStr.replace(/-/g, '[/\\.-]');
                        const regex = new RegExp(cleanDate + '[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})');
                        const m = html.match(regex);
                        if (m) {
                            const insertText = `['${targetDateStr}',['${m[1]}','${m[2]}','${m[3]}','${m[4]}','${m[5]}']],\n`;
                            fileContent = fileContent.replace('var 7788 = [\n', `var 7788 = [\n${insertText}`);
                            fs.writeFileSync(FILE_PATH, fileContent, 'utf-8');
                            console.log(`✅ [多期補登] 成功補入 ${targetDateStr} 的數據！`);
                            process.exit(0);
                        }
                    } catch (e) {
                        console.log('NFD 網頁擷取失敗。');
                    }
                    process.exit(0);
                }

                // 情況二：日期已最新（由一期未更新狀態成功寫入後），因純網頁無區分落球/順球，故不執行重複替換
                if (lastUpdatedDate >= targetDateStr) {
                    console.log('資料已是最新狀態，無需重複處理。');
                    process.exit(0);
                }

                // 情況三：剛好一期未更新 -> 從 NFD 抓取最新一期數字並插入首列
                if (lastUpdatedDate < targetDateStr) {
                    try {
                        const html = await fetchNFDHtml();
                        const cleanDate = targetDateStr.replace(/-/g, '[/\\.-]');
                        const regex = new RegExp(cleanDate + '[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})[\\s\\S]*?(\\d{2})');
                        const m = html.match(regex);
                        if (m) {
                            const insertText = `['${targetDateStr}',['${m[1]}','${m[2]}','${m[3]}','${m[4]}','${m[5]}']],\n`;
                            fileContent = fileContent.replace('var 7788 = [\n', `var 7788 = [\n${insertText}`);
                            fs.writeFileSync(FILE_PATH, fileContent, 'utf-8');
                            console.log(`✅ [一期寫入] 成功插入首列日期 ${targetDateStr} 的獎號！`);
                            process.exit(0);
                        } else {
                            console.log('樂透研究院 NFD 網頁尚未更新該期資料。');
                        }
                    } catch (e) {
                        console.log('連線樂透研究院時發生錯誤。');
                    }
                }

                process.exit(0);
            } catch (err) {
                console.error('運行發生致命錯誤:', err.message);
                process.exit(0);
            }
        }
        main();
        EOF
        
        node update.js

    - name: 4. 檢查檔案變動並自動提交
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add 7788.js
        
        if ! git diff --cached --quiet; then
          git commit -m "🤖 NFD 539 獎號排程更新 [$(date '+%Y-%m-%d %H:%M:%S')]"
          git push
        else
          echo "7788.js 資料內容無變動，安全跳過 Commit。"
        fi
