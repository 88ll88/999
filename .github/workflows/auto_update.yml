name: Auto Update 7788 Data

on:
  schedule:
    # 依照你的開獎與更新時段設定 Cron 定時觸發：
    # 每天晚上 20:40、20:50 (順球時間) 以及 21:00、21:30、22:00 (落球時間) 自動執行
    # 注意：GitHub Actions 的 cron 時間是 UTC 基準，台灣時間 (UTC+8) 20:40 等於 UTC 12:40
    - cron: '40,50 12 * * 1-6'
    - cron: '0,30,0 13,14 * * 1-6'
  workflow_dispatch: # 允許你隨時手動點擊按鈕執行

jobs:
  update-lottery:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼 (Checkout)
        uses: actions/checkout@v3

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 執行智慧更新腳本
        run: node update.js

      - name: 自動提交並推送到 GitHub 倉庫
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add 7788.js
          git commit -m "Auto-update 7788.js lottery data [skip ci]" || exit 0
          git push
