
name: Auto Update 539

on:
  schedule:
    # 台灣時間 (UTC+8) 20:35, 21:00, 21:30, 22:00
    #對應 UTC 時間分別為: 12:35, 13:00, 13:30, 14:00
    - cron: '35 12 * * 1-6'
    - cron: '0 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '0 14 * * 1-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Run update script
        run: node update.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vvv.js ddd.js
          git commit -m "Auto-update 539 results for today" || exit 0
          git push
