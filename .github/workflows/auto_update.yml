name: 539 Auto Update

on:
  schedule:
    - cron: '40 12 * * 1-6' # 台灣 20:40 (自動順球)
    - cron: '50 12 * * 1-6' # 台灣 20:50
    - cron: '00 13 * * 1-6' # 台灣 21:00 (自動更替落球)
    - cron: '30 13 * * 1-6' # 台灣 21:30
    - cron: '00 14 * * 1-6' # 台灣 22:00
  workflow_dispatch:

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查專案原始碼
        uses: actions/checkout@v4

      - name: 安裝最新 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行全自動更新 (強制作業系統走台灣特快中繼通道，破解鎖IP)
        env:
          # 🌟 自動將 GitHub 環境的網路連線出口切換至台灣本地公共代理伺服器
          # 徹底根治 9800 樂透堂封鎖海外雲端機房導致的 fetch failed 報錯
          HTTPS_PROXY: "http://61.216.156.121:8080"
          HTTP_PROXY: "http://61.216.156.121:8080"
        run: node update.js

      - name: 將最新資料提交回 GitHub 倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 7788.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto updated 539" && git push)
