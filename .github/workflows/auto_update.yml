name: 539 Auto Update

on:
  schedule:
    - cron: '40 12 * * 1-6'
    - cron: '00 13 * * 1-6'
    - cron: '30 13 * * 1-6'
    - cron: '00 14 * * 1-6'
  workflow_dispatch:

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查專案原始碼
        uses: actions/checkout@v4

      - name: 安裝最新 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 這裡強制改成最新穩定的 v20，徹底解決錯誤！

      - name: 安裝網頁爬蟲套件
        run: npm install axios cheerio

      - name: 執行更新腳本
        run: node update.js

      - name: 將最新資料提交回 GitHub 倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 7788.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto updated 539 numbers" && git push)
