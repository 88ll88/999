name: 539 彩券資料自動巡邏更新

on:
  schedule:
    # 提示：GitHub Actions 走的是 UTC 時間，台北時間需減 8 小時
    - cron: '40 12 * * *'  # 台北時間 20:40 (搶先更新順球)
    - cron: '50 12 * * *'  # 台北時間 20:50 (順球備用補抓)
    - cron: '00 13 * * *'  # 台北時間 21:00 (落球更替時段)
    - cron: '30 13 * * *'  # 台北時間 21:30 (落球備用更替)
    - cron: '00 14 * * *'  # 台北時間 22:00 (落球最終保險)
  workflow_dispatch:       # 支援手動點擊執行測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查專案原始碼
        uses: actions/checkout@v3

      - name: 配置 Node.js 環境
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 執行更新指令
        run: node update.js

      - name: 檢查檔案是否變更並自動提交回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 7788.js
          if ! git diff --cached --quiet; then
            git commit -m "自動更新開獎數據: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "資料已是最新，本次無資料異動。"
          fi
