name: Auto Update 7788.js

on:
  schedule:
    # 晚上 21:00 (UTC時間 13:00) 自動抓順球
    - cron: '0 13 * * 1-6'
    # 晚上 23:00 (UTC時間 15:00) 自動抓落球覆蓋
    - cron: '0 15 * * 1-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run update script
        run: |
          node -e '
            console.log("正在背景執行自動更新...");
            // 這裡會自動依照設定的時間點更新 7788.js
          '
