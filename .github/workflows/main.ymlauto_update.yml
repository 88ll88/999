name: Auto Update 7788.js

on:
  schedule:
    # 台灣時間 21:00 自動執行（UTC 13:00）
    - cron: '0 13 * * 1-6'
    # 台灣時間 23:00 自動執行（UTC 15:00）
    - cron: '0 15 * * 1-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run update script
        run: |
          node -e '
            console.log("台灣時間 21:00 / 23:00 自動更新排程啟動");
          '
